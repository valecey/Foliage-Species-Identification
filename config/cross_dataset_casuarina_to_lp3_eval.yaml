# Evaluation configuration: Use Casuarina Palm Tree model on LP3 dataset
# This config loads the trained palm tree model from casuarina dataset 
# but evaluates it on LP3 images for cross-dataset testing

# Dataset configuration - Use LP3 for evaluation
dataset:
  name: "lp3"
  train_capture: "first_run"  # Not used for eval, but required by schema
  test_captures: ["m3m"]
  base_path: "./lp3"

# Model configuration - Use Casuarina trained Palm Tree model
model:
  svm_model_dir: "casuarina_first_run_trained_models_palmtree"
  lda_model_path: "lda_v2_casuarina_dinov2_rgb.pickle"
  dinov2_model_name: "facebook/dinov2-base"
  embedding_batch_size: 512
  embedding_num_per_crop: 2048
  random_patch_count: 65536

# Data processing configuration - Use LP3 data paths
data:
  bounds_df_path: "casuarina_bounds_embeddings_lda_v2_dinov2_rgb.pickle"  # Use casuarina embeddings for LDA
  random_px_df_path: "casuarina_random_embeddings_lda_v2_dinov2_rgb.pickle"
  band_filenames_tif: ["result.tif"]
  band_filenames_png: ["result.png"]  # LP3 uses PNG, not JPG like casuarina
  bands_dict:
    rgb: "Red Green Blue"
    wr: "Wideband Red"
    wg: "Wideband Green"
    wb: "Wideband Blue"
  crop_size: 64
  resize_size: 224
  horizontal_flip_prob: 0.5
  batch_size: 1
  morph_structure_size: [3, 3]
  small_holes_size: 10

# Species configuration - Palm Tree from Casuarina training
species:
  species_list: ["Palm Tree"]
  use_biased_svm: true
  sensitivity_target: 0.70

# Training hyperparameters - Not used for evaluation but required
training:
  n_samples_train: 50000
  n_samples_test: 50000
  n_splits_cv: 3
  verbosity: 1
  n_jobs: 1
  random_state: 42

# Output configuration - Update names to reflect cross-dataset evaluation
output:
  output_json: "label_studio_format_bb_cross_dataset_casuarina_to_lp3_palmtree_70.json"
  output_geojson: "label_studio_format_bb_cross_dataset_casuarina_to_lp3_palmtree_70.geojson"
  output_image: "cross_dataset_palmtree_predictions_lp3_70.png"
  crop_output_dir: "crops"

# Visualization configuration
visualization:
  figure_size_per_row: [10, 4.8]
  subplot_wspace: 0.1

# Label Studio configuration - Use LP3 tasks
label_studio:
  url: ""
  api_key: ""
  task_first_run: 84  # LP3 first run task
  task_m3m: 85        # LP3 m3m task
