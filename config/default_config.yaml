# Default configuration for species detection pipeline
# This file contains default values that can be overridden for specific datasets

# Dataset configuration
dataset:
  name: "lp3"
  train_capture: "first_run"
  test_captures: ["m3m"]
  base_path: "./lp3"

# Model configuration
model:
  svm_model_dir: "lp3_first_run_trained_models_maca_v2"
  lda_model_path: "lda_v2_lp3_dinov2_rgb.pickle"
  dinov2_model_name: "facebook/dinov2-base"
  embedding_batch_size: 512
  embedding_num_per_crop: 2048
  random_patch_count: 65536

# Data processing configuration
data:
  bounds_df_path: "lp3_bounds_embeddings_lda_v2_dinov2_rgb.pickle"
  random_px_df_path: "lp3_random_embeddings_lda_v2_dinov2_rgb.pickle"
  band_filenames_tif: ["result.tif"]
  band_filenames_png: ["result.png"]
  bands_dict:
    rgb: "Red Green Blue"
    wr: "Wideband Red"
    wg: "Wideband Green"
    wb: "Wideband Blue"
  crop_size: 64
  resize_size: 224
  horizontal_flip_prob: 0.5
  batch_size: 1
  morph_structure_size: [3, 3]
  small_holes_size: 10

# Species configuration
species:
  species_list: ["Macaranga Gigantea"]
  use_biased_svm: true
  sensitivity_target: 0.70

# Training hyperparameters
training:
  n_samples_train: 50000
  n_samples_test: 50000
  n_splits_cv: 3
  verbosity: 1
  n_jobs: 1
  random_state: 42
  # Note: gamma_values and c_values are computed dynamically in the schema
  # based on numpy ranges, but can be overridden here if needed

# Output configuration
output:
  output_json: "label_studio_format_bb_lp3_horiz_maca_70.json"
  output_geojson: "label_studio_format_bb_lp3_horiz_maca_70.geojson"
  output_image: "macaranga_predictions_lp3_horiz_70.png"
  crop_output_dir: "crops"

# Visualization configuration
visualization:
  figure_size_per_row: [10, 4.8]
  subplot_wspace: 0.1

# Label Studio configuration
label_studio:
  url: ""
  api_key: ""
  task_first_run: 84
  task_m3m: 85
