# Evaluation configuration: Use LP3 Macaranga Gigantea model on Casuarina dataset
# This config loads the trained Macaranga Gigantea model from LP3 dataset 
# but evaluates it on Casuarina images for cross-dataset testing

# Dataset configuration - Use Casuarina for evaluation
dataset:
  name: "casuarina"
  train_capture: "93deg"  # Not used for eval, but required by schema
  test_captures: ["183deg"]
  base_path: "./casuarina/20220418"

# Model configuration - Use LP3 trained Macaranga Gigantea model
model:
  svm_model_dir: "lp3_first_run_trained_models_maca_v2"
  lda_model_path: "lda_v2_lp3_dinov2_rgb.pickle"
  dinov2_model_name: "facebook/dinov2-base"
  embedding_batch_size: 512
  embedding_num_per_crop: 2048
  random_patch_count: 65536

# Data processing configuration - Use Casuarina data paths
data:
  bounds_df_path: "lp3_bounds_embeddings_lda_v2_dinov2_rgb.pickle"  # Use LP3 embeddings for LDA
  random_px_df_path: "lp3_random_embeddings_lda_v2_dinov2_rgb.pickle"
  band_filenames_tif: ["result.tif"]
  band_filenames_png: ["result.jpg"]  # Casuarina uses JPG, not PNG like LP3
  bands_dict:
    rgb: "Red Green Blue"
    wr: "Wideband Red"
    wg: "Wideband Green"
    wb: "Wideband Blue"
  crop_size: 64
  resize_size: 224
  horizontal_flip_prob: 0.5
  batch_size: 1
  morph_structure_size: [3, 3]
  small_holes_size: 10

# Species configuration - Macaranga Gigantea from LP3 training
species:
  species_list: ["Macaranga Gigantea"]
  use_biased_svm: true
  sensitivity_target: 0.70

# Training hyperparameters - Not used for evaluation but required
training:
  n_samples_train: 50000
  n_samples_test: 50000
  n_splits_cv: 3
  verbosity: 1
  n_jobs: 1
  random_state: 42

# Output configuration - Update names to reflect cross-dataset evaluation
output:
  output_json: "label_studio_format_bb_cross_dataset_lp3_to_casuarina_macaranga_70.json"
  output_geojson: "label_studio_format_bb_cross_dataset_lp3_to_casuarina_macaranga_70.geojson"
  output_image: "cross_dataset_macaranga_predictions_casuarina_70.png"
  crop_output_dir: "crops"

# Visualization configuration
visualization:
  figure_size_per_row: [10, 4.8]
  subplot_wspace: 0.1

# Label Studio configuration - Use Casuarina tasks
label_studio:
  url: ""
  api_key: ""
  task_first_run: 3   # Casuarina first run task
  task_m3m: 2         # Casuarina m3m task
